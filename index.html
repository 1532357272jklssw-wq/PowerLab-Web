<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081b2c">
  <meta name="description" content="PowerLab 电源与硬件工程师面试刷题应用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PowerLab">
  <title>PowerLab 题库</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="app.css?v=4">
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="loading-mark">PL</div>
    <strong>PowerLab</strong>
    <span>正在准备离线题库…</span>
  </div>

  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand"><span>PL</span><div><strong>PowerLab</strong><small>POWER ENGINEERING LAB</small></div></div>
      <button id="installButton" class="icon-button install-button" type="button" hidden>安装应用</button>
      <button id="manageButton" class="icon-button" type="button" aria-label="管理题库">题库管理</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-view="library" class="active" type="button"><span>◈</span><label>题库</label></button>
      <button data-view="mistakes" type="button"><span>×</span><label>错题</label></button>
      <button data-view="progress" type="button"><span>↗</span><label>进度</label></button>
    </nav>
  </div>

  <dialog id="managerDialog" class="manager-dialog">
    <form method="dialog" class="dialog-head"><div><small>QUESTION BANK</small><h2>题库管理</h2></div><button aria-label="关闭">×</button></form>
    <div class="dialog-body">
      <section class="current-pack"><small>当前版本</small><strong id="managerVersion">V2.0.0</strong><span id="managerStatus">内置题库</span></section>
      <section class="manager-section">
        <h3>导入本地题库</h3>
        <p>选择 PowerLab 生成的 JSON 文件。通过校验后会保存在浏览器，离线也能使用。</p>
        <label class="file-button">选择 JSON 文件<input id="fileInput" type="file" accept="application/json,.json"></label>
      </section>
      <section class="manager-section">
        <h3>联网检查</h3>
        <p>检查网页上的最新题库文件。发布新 JSON 后，用户无需重新安装应用。</p>
        <button id="checkUpdateButton" class="secondary-button" type="button">立即检查更新</button>
      </section>
      <section class="manager-section danger-zone">
        <h3>恢复默认</h3>
        <p>移除浏览器保存的导入题库，不删除学习记录。</p>
        <button id="restoreButton" class="danger-button" type="button">恢复网页内置题库</button>
      </section>
      <p id="managerMessage" class="manager-message" aria-live="polite"></p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=4" defer></script>
</body>
</html>
